  - { code: ADVICE,  name: Advice and research,   billable: true,  share: 0.18 }
  - { code: CLIENT,  name: Client meetings,       billable: true,  share: 0.13 }
  - { code: NEGOT,   name: Negotiation,           billable: true,  share: 0.11 }
  - { code: DILIG,   name: Due diligence,         billable: true,  share: 0.10 }
