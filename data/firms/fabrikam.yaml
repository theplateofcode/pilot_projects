# Delivery configuration — Phase 3. A law firm runs matters, and the phases are
# the stages of the matter rather than a project plan.
work:
  cadence: phases
  weeklyHours: 37.5
  utilisationTarget: 0.80
  billableDepartments: [COR, RE, EMP, LIT]
  # These codes are deliberately the same as the service offerings the CRM
  # pitches, so a matter opened from a won pitch and one opened directly are
  # the same kind of thing. Diverging codes gave this firm both an "MA" and a
  # "COR_MA" matter type, which is how a reference list rots.
  projectTypes:
  - code: COR_MA
    name: Mergers and acquisitions
    model: fixedFee
    phases: [Instruction, Due diligence, Negotiation, Completion]
  - code: COR_FIN
    name: Banking and finance
    model: timeAndMaterials
    phases: [Instruction, Structuring, Documentation, Completion]
  - code: RE_COMM
    name: Commercial property
    model: fixedFee
    phases: [Instruction, Title and searches, Exchange, Completion]
  - code: EMP_ADV
    name: Employment advisory retainer
    model: retainer
    phases: [Onboarding, Steady state]
  - code: LIT_COMM
    name: Commercial litigation
    model: timeAndMaterials
    phases: [Pre-action, Pleadings, Disclosure, Trial preparation, Hearing]
  - code: LIT_EMP
    name: Employment tribunal
    model: cappedFee
    phases: [Instruction, Preparation, Hearing]
  - code: PRACTICE
    name: Practice and pro bono
    model: nonBillable
    internal: true
    phases: [Delivery]
  roles:
  - { code: PTNR, name: Partner,           billRate: 520, costRate: 260 }
  - { code: SASC, name: Senior associate,  billRate: 360, costRate: 180 }
  - { code: ASC,  name: Associate,         billRate: 250, costRate: 124 }
  - { code: TRN,  name: Trainee,           billRate: 140, costRate: 62 }
  - { code: PARA, name: Paralegal,         billRate: 120, costRate: 52 }
  timeCodes:
