name: Schemas

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r tools/requirements-dev.txt

      - name: Validate schemas
        run: python tools/schematool.py validate

      - name: Check generated data dictionary is up to date
        run: python tools/schematool.py docs --check

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      # Every profile must resolve, not just the one Phase 1 uses.
      - name: Export every profile
        run: |
          for profile in general-firm architecture-firm law-firm law-firm-crm \
                         accounting-firm tech-company travel-starter work-starter \
                         crm-starter hr-starter intranet-starter; do
            python tools/schematool.py export --profile "$profile"
          done

      # The generators are the contract between the schema and the build: a
      # column renamed in the YAML fails the step that touches it, rather than a
      # Dataverse import or a Power BI refresh weeks later.
      #
      # The whole Phase 1 pipeline in one command, in a correct order, with
      # --strict wherever a warning should fail the build.
      - name: Build Phase 1
        run: python tools/build.py --profile hr-starter --prefix wga --solution WoodgroveHR

      # Phase 2, which exercises the same generators against a different module
      # and a different industry — the whole point of the accelerator.
      - name: Build Phase 2
        run: |
          python tools/build.py --profile law-firm-crm --prefix fab \
            --solution FabrikamCRM --firm fabrikam

      # Phase 3, the work-management pilot. The volume one: the demo firm
      # generates more than ten thousand time entries, which is the roadmap's
      # own exit criterion for this phase.
      - name: Build Phase 3
        run: |
          python tools/build.py --profile work-starter --prefix ctw \
            --solution ContosoDelivery --firm contoso

      # Phase 4, the travel pilot. Same generators again, against the module
      # that ships with a Power BI dashboard, a model-driven app for the desk
      # and a canvas app for the traveller.
      - name: Build Phase 4
        run: |
          python tools/build.py --profile travel-starter --prefix nwd \
            --solution NorthwindTravel --firm northwind

      - name: Check the Dataverse plans apply
        run: |
          python tools/dvdeploy.py --plan build/dataverse/hr-starter --dry-run
          python tools/dvdeploy.py --plan build/dataverse/law-firm-crm --dry-run
          python tools/dvdeploy.py --plan build/dataverse/travel-starter --dry-run
          python tools/dvdeploy.py --plan build/dataverse/work-starter --dry-run

      # The approval engine serves every pilot, not only HR, so every starter
      # profile is built. secgen, appgen and pbigen are skipped where their spec
      # declares another profile, which build.py reports.
      # travel-starter and work-starter are not here: each gets a full build
      # of its own above.
      - name: Build every other starter profile
        run: |
          for profile in crm-starter intranet-starter; do
            python tools/build.py --profile "$profile" --prefix pfx \
              --targets schema,dataverse,sql,sharepoint
          done

      # The full profiles exercise the overlay layers the starters do not reach.
      - name: Build the full industry profiles
        run: |
          for profile in accounting-firm law-firm architecture-firm tech-company general-firm; do
            python tools/build.py --profile "$profile" --prefix pfx \
              --targets schema,dataverse,sql,sharepoint,demo
          done

      # Travel and the Intranet are the SharePoint pilots. --strict would fail on
      # the lookup-threshold warnings, which are information about the platform
      # rather than a defect, so limits.md carries them instead.
      - name: Generate the SharePoint templates with their real site names
        run: |
          python tools/spgen.py --profile travel-starter --prefix pfx --site "Northwind Travel"
          python tools/spgen.py --profile intranet-starter --prefix pfx --site "Adatum Intranet"

      - name: Generate every fictional firm
        run: |
          python tools/demodata.py --profile accounting-firm   --firm woodgrove --strict
          python tools/demodata.py --profile law-firm          --firm fabrikam  --strict
          python tools/demodata.py --profile architecture-firm --firm adatum    --strict
          python tools/demodata.py --profile tech-company      --firm contoso   --strict
          python tools/demodata.py --profile general-firm      --firm northwind --strict
