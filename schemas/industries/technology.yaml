    - { code: TEC_PP_DEV, name: Microsoft Certified Power Platform Developer Associate, category: certification, issuingBody: Microsoft, requiresRenewal: true, renewalPeriodMonths: 12 }
    - { code: TEC_GCP_ARCH, name: Google Cloud Professional Cloud Architect, category: certification, issuingBody: Google Cloud, requiresRenewal: true, renewalPeriodMonths: 24 }
    - { code: TEC_CKA, name: Certified Kubernetes Administrator, category: certification, issuingBody: CNCF, requiresRenewal: true, renewalPeriodMonths: 24 }
    - { code: TEC_CISSP, name: CISSP, category: certification, issuingBody: ISC2, requiresRenewal: true, renewalPeriodMonths: 36, requiresCpd: true }
    - { code: TEC_SCRUM, name: Professional Scrum Master, category: certification, issuingBody: Scrum.org }
  Skill:
    - { code: TEC_CSHARP, name: C# / .NET, category: Technical }
    - { code: TEC_TYPESCRIPT, name: TypeScript, category: Technical }
    - { code: TEC_PYTHON, name: Python, category: Technical }
    - { code: TEC_REACT, name: React, category: Technical }
    - { code: TEC_SQL, name: SQL, category: Technical }
    - { code: TEC_AZURE, name: Microsoft Azure, category: Technical }
    - { code: TEC_AWS, name: Amazon Web Services, category: Technical }
    - { code: TEC_K8S, name: Kubernetes, category: Technical }
    - { code: TEC_SPFX, name: SharePoint Framework (SPFx), category: Technical }
