# Contoso Technologies — the software company.
#
# A SaaS product company with sprints, releases and customer implementations.
# Deliberately the one firm with almost no professional credentials, which is
# what makes the compliance page look different and proves the model is not
# only shaped for regulated practices.
#
#   python tools/demodata.py --profile tech-company --firm contoso

profile: tech-company
story: 'A SaaS product company: engineering, product and customer success, with sprints, releases
  and implementation projects.'
