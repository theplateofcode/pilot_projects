# Woodgrove Advisory LLP — the accounting firm.
#
# One file per fictional firm, so tools/demodata.py serves all five rather
# than hardcoding one. Use Microsoft's well-known fictional brands so a
# screenshot never shows a real practice.
#
#   python tools/demodata.py --profile accounting-firm --firm woodgrove

profile: accounting-firm
story: Audit, tax and bookkeeping. Busy-season deadlines, PBC requests through the portal,
  and practising certificates that must not lapse.
firm:
  name: Woodgrove Advisory LLP
  code: WGA
  country: GB
  currency: GBP
  # RFC 2606 reserves .example for documentation, so this domain can never
  # resolve and the demo's addresses can never reach a real inbox.
  domain: woodgroveadvisory.example
  registrationNumber: OC418872
  fiscalYearStartMonth: 4
  timeZone: Europe/London
  # What the top rung is, in WorkerType terms. A partnership has partners;
  # a company has employees all the way up.
  topWorkerType: partner
  legalForm: LLP
