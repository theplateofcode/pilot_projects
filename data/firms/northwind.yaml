# Delivery configuration — Phase 3. A generic firm, so generic project types:
# the point of this firm is that nothing about it is industry-specific.
work:
  cadence: phases
  weeklyHours: 37.5
  utilisationTarget: 0.70
  billableDepartments: [SVC, OPS]
  projectTypes:
  - code: CLIENT
    name: Client project
    model: timeAndMaterials
    phases: [Mobilisation, Delivery, Close]
  - code: FIXED
    name: Fixed-price project
    model: fixedFee
    phases: [Scoping, Delivery, Acceptance]
  - code: RETAIN
    name: Retained service
    model: retainer
    phases: [Onboarding, Steady state]
  - code: INTERNAL
    name: Internal project
    model: nonBillable
    internal: true
    phases: [Delivery]
  roles:
  - { code: LEAD, name: Engagement lead,  billRate: 240, costRate: 125 }
  - { code: CONS, name: Consultant,       billRate: 160, costRate: 82 }
  - { code: ANAL, name: Analyst,          billRate: 105, costRate: 52 }
  - { code: PMO,  name: Project manager,  billRate: 175, costRate: 90 }
  timeCodes:
  - { code: DELIVERY, name: Delivery work,         billable: true,  share: 0.38 }
  - { code: CLIENT,   name: Client meetings,       billable: true,  share: 0.14 }
  - { code: ANALYSIS, name: Analysis,              billable: true,  share: 0.13 }
  - { code: PM,       name: Project management,    billable: true,  share: 0.11 }
  - { code: REPORT,   name: Reporting,             billable: true,  share: 0.08 }
  - { code: INTERNAL, name: Internal project,      billable: false, share: 0.07 }
  - { code: ADMIN,    name: Admin and overhead,    billable: false, share: 0.06 }
  - { code: TRAIN,    name: Training,              billable: false, share: 0.03 }
# Intranet configuration — Phase 5.
intranet:
  hubName: Northwind Hub
  domain: northwind.sharepoint.example
  communities: [Delivery Forum, Wellbeing Group, New Joiners Network]
  serviceCategories:
  - { code: IT_ACCESS, name: Access and accounts,     unit: ITS, response: 4,  resolve: 24 }
  - { code: IT_HW,     name: Hardware and devices,    unit: ITS, response: 8,  resolve: 72 }
  - { code: FAC,       name: Office and facilities,   unit: OPS, response: 8,  resolve: 48 }
  - { code: HR_QUERY,  name: People and payroll,      unit: PPL, response: 24, resolve: 120 }
  - { code: FIN_QUERY, name: Invoices and expenses,   unit: FIN, response: 24, resolve: 96 }
  policies:
  - { number: POL-001, title: Code of conduct,                  category: Code of conduct,           attest: true,  days: 30 }
  - { number: POL-002, title: Information security policy,      category: IT & information security, attest: true,  days: 14 }
  - { number: POL-003, title: Data protection and UK GDPR,      category: Data protection,           attest: true,  days: 14 }
  - { number: POL-004, title: Health and safety,                category: Health & safety,           attest: true,  days: 14 }
  - { number: POL-005, title: Anti-bribery and corruption,      category: Risk & compliance,         attest: true,  days: 30 }
  - { number: POL-006, title: Expenses and travel policy,       category: Finance & expenses,        attest: false }
  - { number: POL-007, title: Flexible working,                 category: HR,                        attest: false }
