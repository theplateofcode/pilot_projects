# Northwind Group — the generic mid-size firm.
#
# Used for the Travel Portal, which is the Microsoft-365-licences-only tier, so
# the firm is deliberately plain: no professional credentials and a single
# office, to show the model works without an industry overlay.
#
#   python tools/demodata.py --profile general-firm --firm northwind

profile: general-firm
story: A mid-size firm with no industry overlay, used for the Travel Portal on SharePoint
  and Power Automate.
firm:
  name: Northwind Group Limited
  code: NWD
  country: GB
  currency: GBP
  # RFC 2606 reserves .example for documentation, so this domain can never
  # resolve and the demo's addresses can never reach a real inbox.
  domain: northwindgroup.example
  registrationNumber: 09218744
  fiscalYearStartMonth: 1
  timeZone: Europe/London
  # What the top rung is, in WorkerType terms. A partnership has partners;
  # a company has employees all the way up.
  topWorkerType: employee
  legalForm: Ltd
offices:
- code: LEE
  name: Leeds
  city: Leeds
  line1: 8 Park Row
  postalCode: LS1 5HD
  timeZone: Europe/London
  share: 1.0
