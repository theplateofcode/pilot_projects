  name: Accounting – HR overlay
  kind: industry
  version: 1.0.0
  dependsOn: [hr]
  description: Accountancy qualifications and CPE/CPD tracking.

termSets:
  TrainingCategory:
    extends: true
    terms:
      - CPE / CPD – technical accounting
      - CPE / CPD – ethics

seed:
  CredentialType:
    - { code: ACC_CPA, name: CPA licence, category: professionalLicence, requiresRenewal: true, renewalPeriodMonths: 24, requiresCpd: true }
    - { code: ACC_ACCA, name: ACCA membership, category: professionalMembership, issuingBody: ACCA, requiresRenewal: true, renewalPeriodMonths: 12, requiresCpd: true }
    - { code: ACC_ACA, name: ICAEW Chartered Accountant (ACA), category: professionalMembership, issuingBody: ICAEW, requiresRenewal: true, renewalPeriodMonths: 12, requiresCpd: true }
    - { code: ACC_ICAI, name: Chartered Accountant (ICAI), category: professionalMembership, issuingBody: ICAI, requiresRenewal: true, renewalPeriodMonths: 12, requiresCpd: true }
    - { code: ACC_CIMA, name: CIMA / CGMA, category: professionalMembership, issuingBody: CIMA, requiresRenewal: true, renewalPeriodMonths: 12, requiresCpd: true }
    - { code: ACC_CTA, name: Chartered Tax Adviser, category: professionalMembership, requiresRenewal: true, renewalPeriodMonths: 12, requiresCpd: true }
    - { code: ACC_EA, name: Enrolled Agent, category: professionalLicence, issuingBody: IRS, requiresRenewal: true, renewalPeriodMonths: 36, requiresCpd: true }
