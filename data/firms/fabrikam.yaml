# Fabrikam Legal LLP — the law firm.
#
# 120 lawyers across litigation and corporate. The detail that matters for a
# demo: bar admissions are a practising requirement, so a lapsed one stops a
# lawyer appearing, and an ethical wall on a sensitive matter is the thing a
# client asks about first.
#
#   python tools/demodata.py --profile law-firm --firm fabrikam

